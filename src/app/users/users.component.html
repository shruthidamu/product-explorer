<div class="container">
    <h1>Users list - first and last</h1>
    <ul>
        @for(user of usersList(); track user.id; let k=$first; let m=$last;) {        
            <li [ngStyle]="{'background-color': k || m ? 'aliceblue':null}">{{ user.name }}</li>
        }
    </ul>
    <br/>
    <h1>Users list - Odd using ngClass</h1>
    <ul>
        @for(user of usersList(); track user.id;) {        
            <li [ngClass]="{'odd-id':user.id%2!==0}">{{ user.name }}</li>
        }
    </ul>
</div>
